name: Update training centers

on:
  schedule:
    # 매주 월요일 한국시간(KST, UTC+9) 오전 9시 30분
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch training centers from welfare.net
        run: python3 scripts/update_training_centers.py

      - name: Geocode new training centers (Kakao)
        if: env.KAKAO_REST_KEY != ''
        continue-on-error: true
        run: python3 scripts/geocode_centers.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training-centers.json data/training-geo.json
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
            exit 0
          fi
          git commit -m "chore: 실습기관 선정 현황 자동 갱신"
          git pull --rebase
          git push
