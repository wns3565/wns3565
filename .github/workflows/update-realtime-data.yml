name: Update realtime data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest postings from welfare.net
        run: |
          set -e
          mkdir -p data /tmp/pages
          for page in $(seq 1 30); do
            curl -s "https://api.welfare.net/prm/na/ntt/selectNttList.do?bbsId=1703&searchType=orgNm&searchValue=&areaCode=&codeT=&pageIndex=10&currPage=${page}" \
              | jq '[.nttListPaging.list[]? | {
                  region: .areaNm,
                  category: .codeT,
                  title: .nttSj,
                  org: (.orgNm // .regNm),
                  date: (.regDt | gsub("\\."; "-")),
                  nttSn: .nttSn
                }]' > "/tmp/pages/page_${page}.json"
          done
          jq -s '{ updatedAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), items: add }' /tmp/pages/page_*.json > data/realtime-data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realtime-data.json
          git diff --staged --quiet || git commit -m "chore: 실습 모집 게시판 데이터 자동 갱신"
          git push
