name: Update realtime data

on:
  schedule:
    # 평일(월~금) 한국시간(KST, UTC+9) 오전 9시~오후 9시, 매시간 7분에 실행 (UTC 0~12시)
    - cron: "7 0-12 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://larcpgjoclnztwuekzkd.supabase.co
      SUPABASE_KEY: sb_publishable_kfzIvZ9tn1JMnV4pSToDTg_hPpLTQhB
    steps:
      - name: Fetch latest postings from welfare.net and upsert into Supabase
        run: |
          set -e
          mkdir -p /tmp/pages
          now="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          for page in $(seq 1 30); do
            curl -sf \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -H "Accept: application/json" \
              "https://api.welfare.net/prm/na/ntt/selectNttList.do?bbsId=1703&searchType=orgNm&searchValue=&areaCode=&codeT=&pageIndex=10&currPage=${page}" \
              | jq -e --arg now "$now" '[.nttListPaging.list[] | {
                  ntt_sn: .nttSn,
                  region: .areaNm,
                  category: .codeT,
                  title: .nttSj,
                  org: (.orgNm // .regNm),
                  date: (.regDt | gsub("\\."; "-")),
                  fetched_at: $now
                }]' > "/tmp/pages/page_${page}.json"
          done

          jq -s 'add' /tmp/pages/page_*.json > /tmp/pages/all.json
          count="$(jq 'length' /tmp/pages/all.json)"
          echo "fetched ${count} items"
          if [ "${count}" -lt 1 ]; then
            echo "::error::welfare.net에서 가져온 데이터가 0건입니다. 요청이 차단됐거나 응답 형식이 바뀌었을 수 있습니다."
            exit 1
          fi

          status="$(curl -s -o /tmp/pages/upsert_response.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/realtime_postings" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data-binary @/tmp/pages/all.json)"
          echo "upsert status: ${status}"
          cat /tmp/pages/upsert_response.json || true
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Supabase upsert 실패 (status ${status})"
            exit 1
          fi
