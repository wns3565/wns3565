name: Update realtime data

on:
  schedule:
    # 평일(월~금) 한국시간(KST, UTC+9) 오전 9시~오후 9시, 매시간 7분에 실행 (UTC 0~12시)
    - cron: "7 0-12 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://larcpgjoclnztwuekzkd.supabase.co
      SUPABASE_KEY: sb_publishable_kfzIvZ9tn1JMnV4pSToDTg_hPpLTQhB
    steps:
      - name: Fetch latest postings from welfare.net and upsert into Supabase
        run: |
          set -e
          mkdir -p /tmp/pages
          now="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          for page in $(seq 1 30); do
            curl -s "https://api.welfare.net/prm/na/ntt/selectNttList.do?bbsId=1703&searchType=orgNm&searchValue=&areaCode=&codeT=&pageIndex=10&currPage=${page}" \
              | jq --arg now "$now" '[.nttListPaging.list[]? | {
                  ntt_sn: .nttSn,
                  region: .areaNm,
                  category: .codeT,
                  title: .nttSj,
                  org: (.orgNm // .regNm),
                  date: (.regDt | gsub("\\."; "-")),
                  fetched_at: $now
                }]' > "/tmp/pages/page_${page}.json"
          done
          jq -s 'add' /tmp/pages/page_*.json > /tmp/pages/all.json
          curl -s -o /dev/null -w "upsert status: %{http_code}\n" \
            -X POST "${SUPABASE_URL}/rest/v1/realtime_postings" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data-binary @/tmp/pages/all.json
