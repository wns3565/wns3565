<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 실습 신청 목록</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap {
    max-width: 480px;
    margin: 80px auto;
    padding: 0 24px;
  }
  .admin-wrap.wide {
    max-width: 1100px;
  }
  .login-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-md);
  }
  .login-card h1 {
    font-size: 1.3rem;
    color: var(--green-900);
    margin-bottom: 20px;
    text-align: center;
  }
  .admin-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-topbar h1 {
    font-size: 1.4rem;
    color: var(--green-900);
  }
  #login-error {
    display: none;
    background: #fdecea;
    color: #c62828;
    border: 1px solid #f5c6c2;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="login-view" class="admin-wrap">
  <div class="login-card">
    <h1>🔒 관리자 로그인</h1>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="admin-email">이메일</label>
        <input type="email" id="admin-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="admin-password">비밀번호</label>
        <input type="password" id="admin-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>
  </div>
</div>

<div id="dashboard-view" class="admin-wrap wide" style="display:none;">
  <div class="admin-topbar">
    <h1>실습 과목 신청 목록</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="admin-email-label" style="font-size:0.85rem; color:var(--text-light);"></span>
      <button id="logout-btn" class="btn btn-outline">로그아웃</button>
    </div>
  </div>

  <div class="data-table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>신청일시</th>
          <th>이름</th>
          <th>연락처</th>
          <th>희망 지역</th>
          <th>희망 기간</th>
        </tr>
      </thead>
      <tbody id="applications-body"></tbody>
    </table>
    <div class="empty-state" id="admin-empty-state">
      아직 접수된 신청이 없습니다.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://larcpgjoclnztwuekzkd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kfzIvZ9tn1JMnV4pSToDTg_hPpLTQhB";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginView = document.getElementById("login-view");
  const dashboardView = document.getElementById("dashboard-view");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");
  const logoutBtn = document.getElementById("logout-btn");
  const emailLabel = document.getElementById("admin-email-label");
  const tbody = document.getElementById("applications-body");
  const emptyState = document.getElementById("admin-empty-state");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  async function loadApplications() {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-light);">불러오는 중...</td></tr>`;
    const { data, error } = await client
      .from("applications")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-light);">목록을 불러오지 못했습니다: ${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    (data || []).forEach((row) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(formatDate(row.created_at))}</td>
        <td>${escapeHtml(row.name)}</td>
        <td>${escapeHtml(row.phone)}</td>
        <td>${escapeHtml(row.region)}</td>
        <td>${escapeHtml(row.period)}</td>
      `;
      tbody.appendChild(tr);
    });
    emptyState.style.display = (data || []).length === 0 ? "block" : "none";
  }

  function showDashboard(session) {
    loginView.style.display = "none";
    dashboardView.style.display = "block";
    emailLabel.textContent = session.user.email;
    loadApplications();
  }

  function showLogin() {
    loginView.style.display = "block";
    dashboardView.style.display = "none";
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.style.display = "none";
    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인해주세요.";
      loginError.style.display = "block";
      return;
    }
    showDashboard(data.session);
  });

  logoutBtn.addEventListener("click", async () => {
    await client.auth.signOut();
    showLogin();
  });

  client.auth.getSession().then(({ data }) => {
    if (data.session) {
      showDashboard(data.session);
    } else {
      showLogin();
    }
  });
</script>
</body>
</html>
